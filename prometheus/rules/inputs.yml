# Hand-written rules for the Nightscout SLOs (ADR 0008, docs/slos.md). The burn-rate rules are
# generated by Sloth into rules/sloth/; this file holds what Sloth needs as input and the guard
# alerts that keep the SLOs from going blind. Tested by rules/tests/*.yml (promtool test rules).
groups:
  - name: sre-lab-sli-inputs
    interval: 30s
    rules:
      # 1 while the newest CGM reading is 10 minutes old or older; 0 otherwise. The freshness SLI
      # is the share of these 30 s samples that are 0 (time-based form of "99% of 5-min windows").
      - record: nightscout:entry_stale:bool
        expr: (time() - nightscout_newest_entry_timestamp_seconds) >= bool 600

      # 1 while fedora can reach the internet (either egress probe succeeds), 0 while neither
      # can. No egress probes at all leaves it absent: BlackboxProbesMissing covers that, and
      # UpstreamCGMStale then cannot fire, so the freshness page is not inhibited (fails loud).
      - record: lab:egress_up:bool
        expr: max(probe_success{job="blackbox-egress"})

  - name: sre-lab-guards
    rules:
      # Both instances stale at once while fedora is online = sensor, phone or Dexcom Share, not
      # anything we run. Informational: Alertmanager inhibits the freshness page while this fires.
      # Both stale while fedora is offline is ours (postmortem 2026-11-10: NIC hang, both
      # instances share fedora's uplink), so it must not count as upstream.
      - alert: UpstreamCGMStale
        expr: |
          nightscout:entry_stale:bool{instance="k3s-copy"} == 1
          and on () nightscout:entry_stale:bool{instance="live"} == 1
          and on () lab:egress_up:bool == 1
        for: 5m
        labels:
          severity: info
          category: freshness
        annotations:
          summary: "Both Nightscout instances are stale: upstream (sensor warm-up, phone, Dexcom Share)."
          runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/cgm-freshness.md"

      # A dead exporter makes the freshness, poll and latency SLIs go silent rather than red.
      - alert: NightscoutExporterDown
        expr: up{job="nightscout-exporter"} == 0
        for: 10m
        labels:
          severity: ticket
          category: monitoring
        annotations:
          summary: "The SLI exporter for {{ $labels.instance }} is not being scraped; its SLOs are blind."
          runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md"

      - alert: BlackboxProbesMissing
        expr: |
          absent(probe_success{job="blackbox-ns-copy"})
          or absent(probe_success{job="blackbox-egress"})
          or up{job=~"blackbox-.*"} == 0
        for: 10m
        labels:
          severity: ticket
          category: monitoring
        annotations:
          summary: "Availability probes are not running; the availability SLO is blind."
          runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md"

      # fedora is offline. Nothing can be delivered while this is true: healthchecks.io pages,
      # because the heartbeat stops. keep_firing_for holds it past recovery so the ticket reaches
      # PagerDuty once egress is back, putting the outage on record.
      - alert: LabEgressDown
        expr: lab:egress_up:bool == 0
        for: 5m
        keep_firing_for: 15m
        labels:
          severity: ticket
          category: monitoring
        annotations:
          summary: "fedora could not reach the internet; every instance and tconnectsync were cut off."
          runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md#labegressdown"

      # Staleness guard for pump data: no tconnectsync event at all looks like zero latency.
      # tconnectsync itself gives up after 180 min without new data (AUTOUPDATE_NO_DATA_FAILURE_MINUTES).
      - alert: PumpDataStale
        expr: time() - nightscout_newest_pump_event_timestamp_seconds{instance="k3s-copy"} > 3 * 3600
        for: 15m
        labels:
          severity: ticket
          category: sync
        annotations:
          summary: "No new pump event on the k3s copy for over 3 hours."
          runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/tconnectsync-polls.md"

      # Prometheus auto-updates (ADR 0008): a release that breaks a rule must not fail silently.
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels:
          severity: ticket
          category: monitoring
        annotations:
          summary: "Rule group {{ $labels.rule_group }} is failing to evaluate."
          runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md"

      # Always firing. Alertmanager forwards it as a heartbeat; its absence means monitoring is down.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          category: monitoring
        annotations:
          summary: "Heartbeat: the alerting pipeline is working."
