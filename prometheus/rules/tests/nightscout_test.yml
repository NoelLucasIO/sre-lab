# promtool test rules prometheus/rules/tests/nightscout_test.yml
# Synthetic series through the real rules: what pages, what tickets, and what must stay quiet.
rule_files:
  - ../inputs.yml
  - ../sloth/nightscout.yml
evaluation_interval: 30s

tests:
  # --- Freshness input and the upstream discriminator -------------------------------------
  - name: freshness flips at 10 min; upstream alert needs both instances stale
    interval: 30s
    input_series:
      # Newest reading frozen at t=0 on both: age = elapsed time.
      - series: 'nightscout_newest_entry_timestamp_seconds{job="nightscout-exporter",instance="k3s-copy"}'
        values: '0x60'
      - series: 'nightscout_newest_entry_timestamp_seconds{job="nightscout-exporter",instance="live"}'
        values: '0x60'
      # fedora online throughout.
      - series: 'probe_success{job="blackbox-egress",instance="https://www.google.com/generate_204"}'
        values: '1x60'
    promql_expr_test:
      - expr: nightscout:entry_stale:bool{instance="k3s-copy"}
        eval_time: 9m
        exp_samples:
          - labels: 'nightscout:entry_stale:bool{job="nightscout-exporter",instance="k3s-copy"}'
            value: 0
      - expr: nightscout:entry_stale:bool{instance="k3s-copy"}
        eval_time: 11m
        exp_samples:
          - labels: 'nightscout:entry_stale:bool{job="nightscout-exporter",instance="k3s-copy"}'
            value: 1
    alert_rule_test:
      - eval_time: 13m        # stale since 10m, `for: 5m` not yet met
        alertname: UpstreamCGMStale
        exp_alerts: []
      - eval_time: 16m
        alertname: UpstreamCGMStale
        exp_alerts:
          - exp_labels: {severity: info, category: freshness, job: nightscout-exporter, instance: k3s-copy}
            exp_annotations:
              summary: "Both Nightscout instances are stale: upstream (sensor warm-up, phone, Dexcom Share)."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/cgm-freshness.md"

  - name: only the copy stale is ours, not upstream
    interval: 30s
    input_series:
      - series: 'nightscout_newest_entry_timestamp_seconds{job="nightscout-exporter",instance="k3s-copy"}'
        values: '0x60'
      - series: 'nightscout_newest_entry_timestamp_seconds{job="nightscout-exporter",instance="live"}'
        values: '0+30x60'      # keeps up with the clock: always fresh
    alert_rule_test:
      - eval_time: 25m
        alertname: UpstreamCGMStale
        exp_alerts: []

  - name: both stale while fedora is offline is ours, not upstream (2026-11-10)
    interval: 30s
    input_series:
      - series: 'nightscout_newest_entry_timestamp_seconds{job="nightscout-exporter",instance="k3s-copy"}'
        values: '0x120'
      - series: 'nightscout_newest_entry_timestamp_seconds{job="nightscout-exporter",instance="live"}'
        values: '0x120'
      # Both egress probes fail for 20 min, then fedora is back online (readings stay frozen).
      - series: 'probe_success{job="blackbox-egress",instance="https://www.cloudflare.com/cdn-cgi/trace"}'
        values: '0x40 1x80'
      - series: 'probe_success{job="blackbox-egress",instance="https://www.google.com/generate_204"}'
        values: '0x40 1x80'
    alert_rule_test:
      - eval_time: 18m          # both stale, but offline: must not be called upstream
        alertname: UpstreamCGMStale
        exp_alerts: []
      - eval_time: 27m          # online again and still stale: now it is upstream
        alertname: UpstreamCGMStale
        exp_alerts:
          - exp_labels: {severity: info, category: freshness, job: nightscout-exporter, instance: k3s-copy}
            exp_annotations:
              summary: "Both Nightscout instances are stale: upstream (sensor warm-up, phone, Dexcom Share)."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/cgm-freshness.md"
      - eval_time: 4m
        alertname: LabEgressDown
        exp_alerts: []
      - eval_time: 30m          # recovered at 20m; still firing so the ticket can be delivered
        alertname: LabEgressDown
        exp_alerts: &egress
          - exp_labels: {severity: ticket, category: monitoring}
            exp_annotations:
              summary: "fedora could not reach the internet; every instance and tconnectsync were cut off."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md#labegressdown"
      - eval_time: 6m
        alertname: LabEgressDown
        exp_alerts: *egress
      - eval_time: 37m          # keep_firing_for (15m) has run out
        alertname: LabEgressDown
        exp_alerts: []

  # --- Availability: fast burn pages, healthy stays quiet ---------------------------------
  - name: probes failing on every node page within minutes
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-ns-copy",instance="k3s-copy",node="k3s-server-1"}'
        values: '1x20 0x40'    # healthy 10 min, then down
      - series: 'probe_success{job="blackbox-ns-copy",instance="k3s-copy",node="k3s-agent-1"}'
        values: '1x20 0x40'
      - series: 'probe_success{job="blackbox-ns-copy",instance="k3s-copy",node="k3s-agent-2"}'
        values: '1x20 0x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: NightscoutAPIAvailabilityBudgetBurn
        exp_alerts: []
      - eval_time: 15m
        alertname: NightscoutAPIAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels: {category: availability, instance: k3s-copy, sloth_id: nightscout-api-availability, sloth_service: nightscout, sloth_slo: api-availability, severity: page, sloth_severity: page}
            exp_annotations:
              summary: "The k3s copy's API is failing probes fast enough to burn the 28-day budget."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/api-availability.md"
              title: "(page) nightscout api-availability SLO error budget burn rate is too fast."
          - exp_labels: {category: availability, instance: k3s-copy, sloth_id: nightscout-api-availability, sloth_service: nightscout, sloth_slo: api-availability, severity: ticket, sloth_severity: ticket}
            exp_annotations:
              summary: "The k3s copy's API is failing probes fast enough to burn the 28-day budget."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/api-availability.md"
              title: "(ticket) nightscout api-availability SLO error budget burn rate is too fast."

  - name: healthy probes raise nothing
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox-ns-copy",instance="k3s-copy",node="k3s-server-1"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: NightscoutAPIAvailabilityBudgetBurn
        exp_alerts: []

  # --- Poll success: failed polls page ----------------------------------------------------
  - name: failing Tandem Source polls page
    interval: 30s
    input_series:
      - series: 'tconnectsync_polls_total{job="nightscout-exporter",instance="k3s-copy",result="success"}'
        values: '0+1x40 40x80'          # polls succeed for 20 min, then stop succeeding
      - series: 'tconnectsync_polls_total{job="nightscout-exporter",instance="k3s-copy",result="failure"}'
        values: '0x40 0+1x80'           # and start failing
      - series: 'tconnectsync_container_restarts{job="nightscout-exporter",instance="k3s-copy"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 15m
        alertname: TconnectsyncPollFailureBudgetBurn
        exp_alerts: []
      - eval_time: 30m
        alertname: TconnectsyncPollFailureBudgetBurn
        exp_alerts:
          - exp_labels: {category: sync, instance: k3s-copy, sloth_id: nightscout-tconnectsync-polls, sloth_service: nightscout, sloth_slo: tconnectsync-polls, severity: page, sloth_severity: page}
            exp_annotations:
              summary: "tconnectsync on the k3s copy is failing Tandem Source polls."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/tconnectsync-polls.md"
              title: "(page) nightscout tconnectsync-polls SLO error budget burn rate is too fast."
          - exp_labels: {category: sync, instance: k3s-copy, sloth_id: nightscout-tconnectsync-polls, sloth_service: nightscout, sloth_slo: tconnectsync-polls, severity: ticket, sloth_severity: ticket}
            exp_annotations:
              summary: "tconnectsync on the k3s copy is failing Tandem Source polls."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/tconnectsync-polls.md"
              title: "(ticket) nightscout tconnectsync-polls SLO error budget burn rate is too fast."

  - name: a window with no events gives error ratio 0, not NaN (NaN would poison the 28-day budget)
    interval: 30s
    input_series:
      - series: 'tconnectsync_polls_total{job="nightscout-exporter",instance="k3s-copy",result="success"}'
        values: '5x40'                  # counter flat: no polls in any 5m window
      - series: 'tconnectsync_polls_total{job="nightscout-exporter",instance="k3s-copy",result="failure"}'
        values: '0x40'
      - series: 'tconnectsync_container_restarts{job="nightscout-exporter",instance="k3s-copy"}'
        values: '0x40'
      - series: 'nightscout_pump_event_latency_seconds_count{job="nightscout-exporter",instance="k3s-copy"}'
        values: '7x40'
      - series: 'nightscout_pump_event_latency_seconds_bucket{job="nightscout-exporter",instance="k3s-copy",le="5400"}'
        values: '7x40'
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m{sloth_slo="tconnectsync-polls"}
        eval_time: 15m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{instance="k3s-copy",sloth_id="nightscout-tconnectsync-polls",sloth_service="nightscout",sloth_slo="tconnectsync-polls",sloth_window="5m"}'
            value: 0
      - expr: slo:sli_error:ratio_rate5m{sloth_slo="pump-latency"}
        eval_time: 15m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{instance="k3s-copy",sloth_id="nightscout-pump-latency",sloth_service="nightscout",sloth_slo="pump-latency",sloth_window="5m"}'
            value: 0

  # --- Pump latency: mostly upstream, so it can only ever ticket ---------------------------
  - name: late pump data tickets and never pages
    interval: 30s
    input_series:
      # Every event arrives later than 90 min (bucket 5400 stays at 0 while count grows).
      - series: 'nightscout_pump_event_latency_seconds_count{job="nightscout-exporter",instance="k3s-copy"}'
        values: '0+1x240'
      - series: 'nightscout_pump_event_latency_seconds_bucket{job="nightscout-exporter",instance="k3s-copy",le="5400"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 60m
        alertname: PumpDataLatencyBudgetBurn
        exp_alerts:
          - exp_labels: {category: sync, instance: k3s-copy, sloth_id: nightscout-pump-latency, sloth_service: nightscout, sloth_slo: pump-latency, severity: ticket, sloth_severity: ticket}
            exp_annotations:
              summary: "Pump data is reaching Nightscout late (end to end, includes Tandem Source)."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/pump-data-latency.md"
              title: "(ticket) nightscout pump-latency SLO error budget burn rate is too fast."

  # --- Guards -----------------------------------------------------------------------------
  - name: exporter down tickets after 10 min; rule failures and the watchdog
    interval: 30s
    input_series:
      - series: 'up{job="nightscout-exporter",instance="live"}'
        values: '1x10 0x60'             # down from 5 min
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="localhost:9091",rule_group="x"}'
        values: '0x10 1x60'
    alert_rule_test:
      - eval_time: 14m
        alertname: NightscoutExporterDown
        exp_alerts: []
      - eval_time: 16m
        alertname: NightscoutExporterDown
        exp_alerts:
          - exp_labels: {severity: ticket, category: monitoring, job: nightscout-exporter, instance: live}
            exp_annotations:
              summary: "The SLI exporter for live is not being scraped; its SLOs are blind."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md"
      - eval_time: 8m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts:
          - exp_labels: {severity: ticket, category: monitoring, job: prometheus, instance: "localhost:9091", rule_group: x}
            exp_annotations:
              summary: "Rule group x is failing to evaluate."
              runbook_url: "https://github.com/NoelLucasIO/sre-lab/blob/main/docs/runbooks/monitoring.md"
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none, category: monitoring}
            exp_annotations:
              summary: "Heartbeat: the alerting pipeline is working."
