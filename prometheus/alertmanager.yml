# Alertmanager for the sre-lab SLOs (ADR 0008). Deployed to /990/alertmanager/config/alertmanager.yml
# (the directory is mounted read-only by prometheus/alertmanager.container); apply with
# `curl -X POST 127.0.0.1:9095/-/reload`. Routing is tested by
# prometheus/alertmanager-test.sh (CI: .github/workflows/rules.yml).
#
#   severity=page    -> PagerDuty service sre-lab-nightscout, severity critical (high urgency)
#   severity=ticket  -> PagerDuty service sre-lab-tickets, urgency fixed Low (email). Urgency comes
#                       from routing, not from PagerDuty's severity-based urgency (a plan feature).
#   Watchdog         -> healthchecks.io ping every minute (external dead man's switch)
#   info / none      -> nowhere (UpstreamCGMStale is used only to inhibit)
# The two PagerDuty Events API v2 routing keys and the healthchecks.io ping URL are Podman
# secrets mounted as files; none is in this file or the repo.
global:
  resolve_timeout: 5m

route:
  receiver: pagerduty-ticket          # anything unexpected still reaches a human, at low urgency
  group_by: [alertname, sloth_slo, instance, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead man's switch: Watchdog always fires, so healthchecks.io gets a ping every minute. If the
    # pings stop (fedora, Prometheus, Alertmanager, power or network down), healthchecks.io alerts
    # from outside the lab after 5 min period + 5 min grace.
    - matchers: ['alertname="Watchdog"']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="page"']
      receiver: pagerduty-page
      repeat_interval: 1h
    - matchers: ['severity="ticket"']
      receiver: pagerduty-ticket
      repeat_interval: 24h
    - matchers: ['severity=~"info|none"']
      receiver: blackhole

inhibit_rules:
  # Sensor warm-up, phone or Dexcom Share: both instances stale, so not ours. The budget is still
  # spent (the SLO stays user-facing), but nobody gets paged for a sensor change.
  - source_matchers: ['alertname="UpstreamCGMStale"']
    target_matchers: ['alertname="NightscoutCGMFreshnessBudgetBurn"', 'severity="page"']
    equal: [instance]
  # A page already covers the same SLO: drop its ticket.
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="ticket"']
    equal: [alertname, sloth_slo, instance]

receivers:
  - name: pagerduty-page
    pagerduty_configs:
      - routing_key_file: /run/secrets/pagerduty-routing-key
        client: sre-lab Alertmanager (Grafana)
        # LAN/VPN only, like the rest of the lab. Not --web.external-url: that also moves the API paths.
        client_url: https://grafana.noellucas.io/alerting/groups?alertmanager=sre-lab-alertmanager
        severity: critical
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        links:
          - href: '{{ .CommonAnnotations.runbook_url }}'
            text: Runbook
        details:
          slo: '{{ .CommonLabels.sloth_slo }}'
          instance: '{{ .CommonLabels.instance }}'
          severity: '{{ .CommonLabels.severity }}'
          firing: '{{ .Alerts.Firing | len }}'
  - name: pagerduty-ticket
    pagerduty_configs:
      - routing_key_file: /run/secrets/pagerduty-ticket-routing-key
        client: sre-lab Alertmanager (Grafana)
        # LAN/VPN only, like the rest of the lab. Not --web.external-url: that also moves the API paths.
        client_url: https://grafana.noellucas.io/alerting/groups?alertmanager=sre-lab-alertmanager
        severity: warning
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'
        links:
          - href: '{{ .CommonAnnotations.runbook_url }}'
            text: Runbook
        details:
          slo: '{{ .CommonLabels.sloth_slo }}'
          instance: '{{ .CommonLabels.instance }}'
          severity: '{{ .CommonLabels.severity }}'
          firing: '{{ .Alerts.Firing | len }}'
  - name: heartbeat
    webhook_configs:
      - url_file: /run/secrets/healthchecks-watchdog-url   # https://hc-ping.com/<uuid>: the UUID is the credential
        send_resolved: false
        max_alerts: 1
        timeout: 10s
  - name: blackhole
