# sre-lab: Terraform pipeline
#   PR:          static checks (GitHub-hosted) -> plan per root (self-hosted) -> change-risk gate -> sticky PR comment
#   push main:   static checks -> plan saved on runner disk (one directory per run) -> risk report -> apply (environment `lab`, required reviewer)
# Plan files never leave the runner (no artifacts): this is a public repo and plan files hold raw values.
# AWS: short-lived credentials via GitHub OIDC (plan: read-only role; apply: role trusted only for the
# `lab` environment). The account ID is the repository variable AWS_ACCOUNT_ID.
# Change risk: >2 destroys/replaces, or anything tagged `critical`, fails the PR unless it has the
# `override-risk` label. On main it is report-only (job summary), so the reviewer sees it before approving.
name: terraform

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]  # every PR: these checks are required on main
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policy/**'
      - 'keys/**'          # baked into VM cloud-init by envs/lab
      - 'ci/risk-check*'
      - '.tflint.hcl'
      - '.checkov.yaml'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time on main (push and dispatch alike): a second run queues and plans against the
# state the first one left, instead of racing it to apply. PR runs replace their own older runs.
# DR drill 2026-11-11, finding 3: two dispatches on one commit shared a plan directory.
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # Apply order matters: the image root before the VMs that use it.
  ROOTS: "lab-base lab observability aws"
  # envs/aws-bootstrap (the CI roles themselves) is checked here but planned and applied only by a
  # human: CI must not be able to change its own permissions (ADR 0009).
  STATIC_ROOTS: "lab-base lab observability aws-bootstrap aws"
  AWS_REGION: us-east-2

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0

      - name: Install Checkov
        run: pipx install checkov==3.4.3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          for r in $STATIC_ROOTS; do
            echo "::group::validate $r"
            terraform -chdir="terraform/envs/$r" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="terraform/envs/$r" validate -no-color
            echo "::endgroup::"
          done

      - name: module tests (mocked providers)
        run: |
          for m in terraform/modules/*/; do
            ls "$m"tests/*.tftest.hcl >/dev/null 2>&1 || continue
            echo "::group::test $m"
            terraform -chdir="$m" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$m" test -no-color
            echo "::endgroup::"
          done

      - name: tflint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}   # avoids rate limits on plugin download
        run: |
          tflint --init --config "$PWD/../.tflint.hcl"
          tflint --recursive --config "$PWD/../.tflint.hcl"

      - name: checkov
        run: checkov --config-file .checkov.yaml

      - name: policy fixture tests
        run: ./policy/test.sh

      - name: change-risk gate tests
        run: ./ci/risk-check-test.sh

  plan:
    name: plan
    needs: static
    # Never run fork code on the LAN runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, fedora]
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # GitHub OIDC -> AWS role sre-lab-plan (read-only); no AWS keys stored anywhere
    concurrency:
      # Event in the key: a late PR run must not cancel main's plan (PR #28, 2026-11-09).
      group: tf-plan-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      failed: ${{ steps.plan.outputs.failed }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/sre-lab/sre-lab-plan
          role-session-name: plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        id: plan
        run: |
          set -a
          for f in pg grafana technitium aws; do . "$HOME/.config/terraform/$f.env"; done
          set +a
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR" "$HOME/plans/$GITHUB_RUN_ID"
          chmod 700 "$HOME/plans" "$HOME/plans/$GITHUB_RUN_ID"

          out="$RUNNER_TEMP/comment.md"
          printf '### Terraform plan for `%s`\n\n' "${GITHUB_SHA::7}" > "$out"
          changed=""; failed=""
          : > "$RUNNER_TEMP/specs"

          for r in $ROOTS; do
            d="terraform/envs/$r"
            log="$RUNNER_TEMP/$r.log"
            set +e
            {
              terraform -chdir="$d" init -input=false -no-color >/dev/null &&
              terraform -chdir="$d" plan -input=false -no-color -lock-timeout=120s \
                -detailed-exitcode -out="$HOME/plans/$GITHUB_RUN_ID/$r.tfplan"
            } > "$log" 2>&1
            rc=$?
            set -e
            case $rc in
              0) status="no changes" ;;
              2) status="<b>changes</b>"; changed="$changed $r" ;;
              *) status="<b>FAILED (exit $rc)</b>"; failed="$failed $r" ;;
            esac
            if [ "$rc" = 2 ]; then
              terraform -chdir="$d" show -json "$HOME/plans/$GITHUB_RUN_ID/$r.tfplan" > "$RUNNER_TEMP/$r.plan.json"
              printf '%s ' "$r=$RUNNER_TEMP/$r.plan.json" >> "$RUNNER_TEMP/specs"
            fi
            {
              printf '<details><summary><code>%s</code>: %s</summary>\n\n```hcl\n' "$r" "$status"
              grep -vE '^(.*: (Refreshing state|Reading)\.\.\.|.*: Read complete after)' "$log" || true
              printf '\n```\n</details>\n\n'
            } >> "$out"
            cat "$log"
          done

          echo "changed=${changed# }" >> "$GITHUB_OUTPUT"
          echo "failed=${failed# }"   >> "$GITHUB_OUTPUT"

      - name: change risk
        id: risk
        if: steps.plan.outputs.changed != ''
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'override-risk') }}
        run: |
          args=(--max-destroy 2)
          [ "$OVERRIDE" = true ] && args+=(--override)
          [ "$GITHUB_EVENT_NAME" = pull_request ] || args+=(--report-only)
          read -ra specs < "$RUNNER_TEMP/specs" || true   # read returns 1 at EOF without newline; array is still filled
          set +e
          python3 -I ci/risk-check.py "${args[@]}" "${specs[@]}" > "$RUNNER_TEMP/risk.md"
          rc=$?
          set -e
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/risk.md"
          cat "$RUNNER_TEMP/risk.md" "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/c2" && mv "$RUNNER_TEMP/c2" "$RUNNER_TEMP/comment.md"
          [ "$rc" = 0 ] && echo "blocked=false" >> "$GITHUB_OUTPUT" || echo "blocked=true" >> "$GITHUB_OUTPUT"

      - name: post plan to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/comment.md`;
            const marker = '<!-- sre-lab-plan -->';
            let body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '### Terraform plan did not run; see job log.\n';
            if (body.length > 64000) body = body.slice(0, 64000) + '\n```\n</details>\n\n_Truncated; see job log._\n';
            body = `${marker}\n${body}\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: fail on plan error
        if: steps.plan.outputs.failed != ''
        run: |
          echo "::error::plan failed for: ${{ steps.plan.outputs.failed }}"
          exit 1

      - name: fail on change risk
        if: steps.risk.outputs.blocked == 'true'
        run: |
          echo "::error::change-risk gate blocked this plan; review it, then add the override-risk label to proceed"
          exit 1

  apply:
    name: apply
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.changed != ''
    runs-on: [self-hosted, fedora]
    environment: lab          # required reviewer = approval gate
    concurrency:
      group: tf-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> AWS role sre-lab-apply, trusted only for the `lab` environment
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials (apply role)
        if: contains(format(' {0} ', needs.plan.outputs.changed), ' aws ')
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/sre-lab/sre-lab-apply
          role-session-name: apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: apply saved plans
        env:
          CHANGED: ${{ needs.plan.outputs.changed }}
        run: |
          set -a
          for f in pg grafana technitium aws; do . "$HOME/.config/terraform/$f.env"; done
          set +a
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          dir="$HOME/plans/$GITHUB_RUN_ID"
          for r in $ROOTS; do
            case " $CHANGED " in *" $r "*) ;; *) continue ;; esac
            echo "::group::apply $r"
            terraform -chdir="terraform/envs/$r" init -input=false -no-color >/dev/null
            # A saved plan refuses to apply if state moved since it was made.
            terraform -chdir="terraform/envs/$r" apply -input=false -no-color -lock-timeout=120s "$dir/$r.tfplan"
            echo "::endgroup::"
          done
          rm -rf "$dir"

      - name: prune stale plans
        if: always()
        run: find "$HOME/plans" -mindepth 1 -maxdepth 1 -type d -mtime +2 -exec rm -rf {} +
