# /990/garage/garage.toml — single node, Garage v2.x
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
metadata_snapshots_dir = "/var/lib/garage/snapshots"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

# Low write volume (nightly dumps): take durability over throughput.
metadata_fsync = true
data_fsync = true

replication_factor = 1
compression_level = 1
block_size = "1M"

# RPC stays on loopback: single node, nothing else should talk to it.
rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage-rpc-secret"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
# /metrics (bearer metrics_token) and admin API v2 (bearer admin_token)
api_bind_addr = "0.0.0.0:3903"
admin_token_file = "/run/secrets/garage-admin-token"
metrics_token_file = "/run/secrets/garage-metrics-token"
